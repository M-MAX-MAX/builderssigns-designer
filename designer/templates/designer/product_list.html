{% load static %}
<!DOCTYPE html>
<html lang="en-au">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Product — Builders Signs</title>
  <link rel="icon" type="image/png" href="{% static 'designer/favicon/favicon.png' %}">
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('{% static "designer/fonts/inter-var.woff2" %}') format('woff2');
    }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-bottom: 96px;
      min-height: 100vh;
      background-color: #ffffff;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }

    .main-header {
      width: 100%;
      height: 96px;
      border-bottom: 1px solid #E5E5E5;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 0 20px;
      margin-bottom: 64px;
    }
    .header-inner {
      width: 100%;
      max-width: 1216px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .header-logo { width: 201px; height: 42px; display: flex; align-items: center; justify-content: center; }
    .header-logo img { width: 100%; height: 100%; object-fit: contain; }

    .onboarding-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 64px;
      padding: 0 20px;
      width: 100%;
    }
    .title { color: #171717; font-size: 30px; font-weight: 600; line-height: 38px; margin: 0; }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      width: 100%;
      max-width: 1216px;
      justify-items: center;
    }
    .card-item {
      width: 384px;
      max-width: 100%;
      background-color: #FAFAFA;
      border-radius: 16px;
      border: 1px solid #E5E5E5;
      padding: 22px 2px 36px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }
    .card-item:hover { background-color: #F0F0F0; transform: translateY(-4px); }
    .card-image {
      width: 100%;
      max-width: 380px;
      height: 244px;
      border-radius: 16px;
      object-fit: cover;
      background: #E5E5E5;
    }
    .card-text { color: #171717; font-size: 20px; font-weight: 600; line-height: 30px; margin: 0; text-align: center; word-wrap: break-word; }

    @media (max-width: 960px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 630px) {
      .main-header { height: auto; padding: 20px; margin-bottom: 40px; }
      .title { font-size: 24px; }
      .cards-grid { grid-template-columns: 1fr; }
      .card-image { height: auto; aspect-ratio: 380 / 244; }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-inner">
      <div class="header-logo">
        <img src="{% static 'designer/logo/logo.svg' %}" alt="Builders Signs">
      </div>
    </div>
  </header>

  <div class="onboarding-container">
    <h1 class="title">Select Product<br>Templates</h1>

    <div class="cards-grid">
      {% for product in products %}
        <a href="{% url 'designer:gallery' product.slug %}" class="card-item">
          {% if product.card_image %}
            <img class="card-image" src="{{ product.card_image.url }}" alt="{{ product.name }}">
          {% else %}
            <div class="card-image"></div>
          {% endif %}
          <h2 class="card-text">{{ product.name }}</h2>
        </a>
      {% endfor %}
    </div>
  </div>

</body>
</html>
